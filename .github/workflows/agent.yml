name: Executive assistant agent

# Runs the agent on a schedule. This lives in Actions rather than a Cowork
# scheduled session because Cowork sessions sit behind an egress allowlist that
# does not include *.supabase.co — they cannot reach the workspace at all.
#
# NOTE: GitHub cron is always UTC and does not follow daylight saving. The times
# below are tuned for EDT (UTC-4). When New York falls back to EST (UTC-5) each
# run lands an hour earlier local; shift the hours by +1 if that matters.

on:
  schedule:
    # 07:30 ET weekdays — morning brief
    - cron: '30 11 * * 1-5'
    # 13:00 ET weekdays — midday triage
    - cron: '0 17 * * 1-5'
    # 17:30 ET weekdays — evening close-out
    - cron: '30 21 * * 1-5'
    # 09:00 ET Mondays — delegation chase sweep
    - cron: '0 13 * * 1'

  workflow_dispatch:
    inputs:
      run_kind:
        description: Which run to perform
        required: true
        default: adhoc
        type: choice
        options:
          - morning_brief
          - midday_triage
          - evening_closeout
          - chase_sweep
          - adhoc
      dry_run:
        description: Think and log, but make no changes
        required: false
        default: false
        type: boolean

concurrency:
  # Never let two runs write to the workspace at once.
  group: agent-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve run kind
        id: kind
        run: |
          case "${{ github.event.schedule }}" in
            "30 11 * * 1-5") KIND=morning_brief ;;
            "0 17 * * 1-5")  KIND=midday_triage ;;
            "30 21 * * 1-5") KIND=evening_closeout ;;
            "0 13 * * 1")    KIND=chase_sweep ;;
            *)               KIND="${{ inputs.run_kind || 'adhoc' }}" ;;
          esac
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Run kind: $KIND"

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          AGENT_API_URL: https://jfvwpxykktyehqeliwnx.supabase.co/functions/v1/agent-api
          AGENT_RUN_KIND: ${{ steps.kind.outputs.kind }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-sonnet-5' }}
          AGENT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node agent/runner.mjs
